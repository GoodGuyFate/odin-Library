<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-header">
      <h1>Library</h1>
    </div>
    <div class="background-image-container">
      <img src="images/library.jpg" alt="cozy library" />
    </div>
    <div class="action-bar">
      <button id="add-book-btn">Add New Book</button>
    </div>
    <div id="form-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Book</h2>
          <span class="close-button">&times;</span>
        </div>
        <form action="" id="new-book-form" novalidate>
          <input type="text" id="title" placeholder="Title" required />
          <span class="error" aria-live="polite"></span>
          <input type="text" id="author" placeholder="Author" required />
          <span class="error" aria-live="polite"></span>
          <input type="number" id="pages" placeholder="Pages" min="1" required />
          <span class="error" aria-live="polite"></span>
          <div class="input-group">
            <label for="cover">Book Cover Image</label>
            <input type="file" id="cover" accept="image/*" />
            <p class="input-hint">
              Optional: If empty, a default cover will be used.
            </p>
          </div>
          <label class="checkbox-container">
            <input type="checkbox" id="read" />
            <span class="checkmark"></span>
            Have you read it?
          </label>
          <button type="submit" id="submit-book">Add to Library</button>
        </form>
      </div>
    </div>
    <div class="library-content">
      <div class="book-card-container"></div>
    </div>
    <div class="footer">
        <p id="copyright-text">&copy; <span id="current-year"></span>
            <a href="https://github.com/GoodGuyFate" target="_blank" rel="noopener noreferrer" class="footer-link">Goodguyfate</a>.
            All rights reserved.</p>
    </div>
  </body>
</html>
